const ProjectShot = ({ p }) => {
  const [imgFailed, setImgFailed] = useState(false);
  if (p.image && !imgFailed) {
    return (
      <BrowserFrame domain={p.domain}>
        <img
          src={p.image}
          alt={`Captura de ${p.title}`}
          loading="lazy"
          onError={() => setImgFailed(true)}
          className="h-full w-full object-cover object-top"
        />
      </BrowserFrame>
    );
  }
  const body = {
    store: <ShotStore />,
    brand: <ShotBrand />,
    locksmith: <ShotLocksmith />,
    concrete: <ShotConcrete />,
  }[p.thumb];
  return (
    <div className="relative">
      <BrowserFrame domain={p.domain}>{body}</BrowserFrame>
      <span className="absolute bottom-2 right-2 rounded bg-zinc-950/80 px-2 py-0.5 font-mono text-[10px] text-zinc-500">
        {p.demo ? "Demo / concepto" : "Vista ilustrativa"}
      </span>
    </div>
  );
};

                  aria-describedby={errors.name ? "cf-name-err" : undefined}
                  placeholder="Tu nombre"
                  className={`${field} ${errors.name ? "border-red-400" : "border-zinc-700"}`}
                />
                {errors.name && (
                  <p id="cf-name-err" className="mt-1.5 text-sm text-red-400">
                    {errors.name}
                  </p>
                )}
              </div>
              <div>
                <label htmlFor="cf-email" className="mb-1.5 block text-sm font-medium text-zinc-200">
                  Email
                </label>
                <input
                  id="cf-email"
                  type="email"
                  autoComplete="email"
                  value={form.email}
                  onChange={update("email")}
                  aria-invalid={!!errors.email}
                  aria-describedby={errors.email ? "cf-email-err" : undefined}
                  placeholder="nombre@empresa.cl"
                  className={`${field} ${errors.email ? "border-red-400" : "border-zinc-700"}`}
                />
                {errors.email && (
                  <p id="cf-email-err" className="mt-1.5 text-sm text-red-400">
                    {errors.email}
                  </p>
                )}
              </div>
              <div>
                <label htmlFor="cf-message" className="mb-1.5 block text-sm font-medium text-zinc-200">
                  Mensaje
                </label>
                <textarea
                  id="cf-message"
                  rows={5}
                  value={form.message}
                  onChange={update("message")}
                  aria-invalid={!!errors.message}
                  aria-describedby={errors.message ? "cf-message-err" : undefined}
                  placeholder="Cuéntame qué necesitas: tipo de sitio, plazos, referencias."
                  className={`${field} resize-y ${errors.message ? "border-red-400" : "border-zinc-700"}`}
                />
                {errors.message && (
                  <p id="cf-message-err" className="mt-1.5 text-sm text-red-400">
                    {errors.message}
                  </p>
                )}
              </div>
              <button
                type="submit"
                className="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400 sm:w-auto"
              >
                <Send className="h-4 w-4" />
                Enviar Mensaje
              </button>

              <div aria-live="polite">
                {ready && (
                  <div className="rounded-lg border border-cyan-400/30 bg-cyan-400/5 p-4">
                    <p className="text-sm text-zinc-200">
                      Tu mensaje está listo. Para enviarlo, ábrelo en WhatsApp
                      con los datos que escribiste.
                    </p>
                    <a
                      href={waFormLink}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="mt-3 inline-flex items-center gap-2 rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-cyan-300"
                    >
                      <MessageCircle className="h-4 w-4" />
                      Abrir en WhatsApp
                    </a>
                  </div>
                )}
              </div>
            </form>
          </div>
        </Section>
      </main>

      {/* ----------------------------- Footer ----------------------------- */}
      <footer className="border-t border-zinc-800">
        <div className="mx-auto flex w-full max-w-6xl flex-col gap-2 px-4 py-8 text-sm text-zinc-500 sm:flex-row sm:items-center sm:justify-between sm:px-6">
          <p>© 2026 Kevin Zamorano · Analista Programador y Desarrollador Web</p>
          <a href="#inicio" className="text-zinc-400 hover:text-cyan-300">
            Volver arriba
          </a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Portfolio />);

</script>
</body>
</html>
